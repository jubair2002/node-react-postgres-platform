name: CI/CD

on:
  push:
    branches:
      - main
      - "pre-release/v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back: dev, preprod, or release"
        required: false
        type: choice
        options:
          - dev
          - preprod
          - release

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: backend
        run: node --check src/index.js && node --check src/worker.js

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag and environment
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF_NAME" in
            main) echo "namespace=dev" >> "$GITHUB_OUTPUT" ;;
            pre-release/v*) echo "namespace=preprod" >> "$GITHUB_OUTPUT" ;;
            release/v*) echo "namespace=release" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported deployment branch"; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            jubair2002/assesment-backend:${{ steps.meta.outputs.tag }}
            jubair2002/assesment-backend:${{ steps.meta.outputs.namespace }}-latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            jubair2002/assesment-frontend:${{ steps.meta.outputs.tag }}
            jubair2002/assesment-frontend:${{ steps.meta.outputs.namespace }}-latest

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    environment: ${{ needs.build-and-push.outputs.namespace }}
    env:
      NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
      TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${{ secrets.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is missing"; exit 1; }
          test -n "$OPENSEARCH_INITIAL_ADMIN_PASSWORD" || { echo "OPENSEARCH_INITIAL_ADMIN_PASSWORD is missing"; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME is missing"; exit 1; }

      - name: Create namespace and application secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${{ secrets.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          # URL-encode the database password so special characters are safe in URLs.
          ENCODED_PASSWORD="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')"

          DB_WRITE_URL="postgres://appuser:${ENCODED_PASSWORD}@postgres:5432/appdb"
          DB_READ_URL="postgres://appuser:${ENCODED_PASSWORD}@postgres:5432/appdb"

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secrets \
            -n "$NAMESPACE" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_WRITE_URL="$DB_WRITE_URL" \
            --from-literal=DB_READ_URL="$DB_READ_URL" \
            --from-literal=OPENSEARCH_INITIAL_ADMIN_PASSWORD="$OPENSEARCH_INITIAL_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply all application manifests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$MANIFEST_DIR"' EXIT

          cp k8s/10-postgres.yaml \
             k8s/20-backend.yaml \
             k8s/30-frontend.yaml \
             k8s/40-ingress.yaml \
             k8s/50-redis-search.yaml \
             k8s/60-worker.yaml \
             "$MANIFEST_DIR/"

          # Adapt manifests to the environment selected by the branch.
          sed -i "s/namespace: dev/namespace: ${NAMESPACE}/g" "$MANIFEST_DIR"/*.yaml

          # Use the same immutable commit tag for all application images.
          sed -i "s#image: jubair2002/assesment-backend:.*#image: jubair2002/assesment-backend:${TAG}#" \
            "$MANIFEST_DIR/20-backend.yaml" \
            "$MANIFEST_DIR/60-worker.yaml"

          sed -i "s#image: jubair2002/assesment-frontend:.*#image: jubair2002/assesment-frontend:${TAG}#" \
            "$MANIFEST_DIR/30-frontend.yaml"

          kubectl apply -f "$MANIFEST_DIR/"

      - name: Wait for infrastructure
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/postgres -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/redis -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/search -n "$NAMESPACE" --timeout=300s

      - name: Wait for application deployments
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/worker -n "$NAMESPACE" --timeout=180s

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployments,pods,services,ingress -n "$NAMESPACE"
          kubectl wait --for=condition=Ready pods \
            -l 'app in (postgres,redis,search,backend,frontend,worker)' \
            -n "$NAMESPACE" --timeout=60s

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_namespace != ''
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Roll back backend and frontend
        env:
          NAMESPACE: ${{ inputs.rollback_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout undo deployment/backend -n "$NAMESPACE"
          kubectl rollout undo deployment/frontend -n "$NAMESPACE"
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s
