
name: CI/CD

on:
  push:
    branches:
      - master
      - "pre-release/v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back: dev, preprod, or release"
        required: false
        type: choice
        options:
          - dev
          - preprod
          - release

permissions:
  contents: read

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/assesment-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/assesment-frontend

jobs:
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend
        working-directory: backend
        run: node --check src/index.js

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag and environment
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"

          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF_NAME" in
            master)
              echo "namespace=dev" >> "$GITHUB_OUTPUT"
              ;;
            pre-release/v*)
              echo "namespace=preprod" >> "$GITHUB_OUTPUT"
              ;;
            release/v*)
              echo "namespace=release" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment branch"
              exit 1
              ;;
          esac

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.namespace }}-latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.namespace }}-latest

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push

    # Install a self-hosted runner on the EC2 instance running kind.
    runs-on: [self-hosted, linux, x64]

    environment: ${{ needs.build-and-push.outputs.namespace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DB_PASSWORD"

          DB_WRITE_URL="postgres://appuser:${DB_PASSWORD}@postgres:5432/appdb"
          DB_READ_URL="postgres://appuser:${DB_PASSWORD}@postgres:5432/appdb"

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secrets \
            -n "$NAMESPACE" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_WRITE_URL="$DB_WRITE_URL" \
            --from-literal=DB_READ_URL="$DB_READ_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/assessment-manifests
          cp k8s/10-postgres.yaml \
             k8s/20-backend.yaml \
             k8s/30-frontend.yaml \
             k8s/40-ingress.yaml \
             /tmp/assessment-manifests/

          sed -i "s/namespace: dev/namespace: ${NAMESPACE}/g" \
            /tmp/assessment-manifests/*.yaml

          sed -i \
            "s#image: jubair2002/assesment-backend:.*#image: jubair2002/assesment-backend:${TAG}#" \
            /tmp/assessment-manifests/20-backend.yaml

          sed -i \
            "s#image: jubair2002/assesment-frontend:.*#image: jubair2002/assesment-frontend:${TAG}#" \
            /tmp/assessment-manifests/30-frontend.yaml

          kubectl apply -f /tmp/assessment-manifests/

          kubectl rollout status deployment/postgres \
            -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/backend \
            -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend \
            -n "$NAMESPACE" --timeout=180s

      - name: Verify deployment
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
        run: kubectl get pods,services,ingress -n "$NAMESPACE"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_namespace != ''
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Roll back backend and frontend
        env:
          NAMESPACE: ${{ inputs.rollback_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout undo deployment/backend -n "$NAMESPACE"
          kubectl rollout undo deployment/frontend -n "$NAMESPACE"
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s
